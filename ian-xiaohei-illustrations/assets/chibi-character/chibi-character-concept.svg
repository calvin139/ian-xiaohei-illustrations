<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background -->
  <rect width="512" height="512" fill="#fafafa"/>
  
  <!-- Floating decorative elements (subtle, semi-transparent) -->
  <circle cx="80" cy="100" r="12" fill="#7eb3d4" opacity="0.4"/>
  <circle cx="450" cy="150" r="8" fill="#c8a8d4" opacity="0.35"/>
  <polygon points="420,380 430,395 410,395" fill="#7eb3d4" opacity="0.3"/>
  <rect x="100" y="380" width="20" height="20" fill="#9ec8d4" opacity="0.35" transform="rotate(45 110 390)"/>
  <line x1="150" y1="70" x2="170" y2="85" stroke="#a8d4c8" stroke-width="3" opacity="0.3" stroke-linecap="round"/>
  
  <!-- Body (small, simple) -->
  <ellipse cx="256" cy="380" rx="45" ry="60" fill="#b3d9e8" opacity="0.8"/>
  
  <!-- Neck/connection -->
  <rect x="240" y="300" width="32" height="35" fill="#c8e4f0" rx="5" opacity="0.8"/>
  
  <!-- Head (large, round) -->
  <circle cx="256" cy="200" r="110" fill="#d4e8f5" opacity="0.9" stroke="#8ba8c8" stroke-width="2"/>
  
  <!-- Soft head shadow/contour -->
  <ellipse cx="256" cy="200" rx="110" ry="115" fill="none" stroke="#c0d8e8" stroke-width="1.5" opacity="0.4"/>
  
  <!-- Hair (layered, soft edges) -->
  <path d="M 150 180 Q 120 150 140 100 Q 160 80 256 70 Q 340 75 370 100 Q 390 140 360 180 Q 340 200 256 210 Q 170 200 150 180" 
        fill="#8fa8c8" opacity="0.85"/>
  
  <!-- Hair highlights/texture -->
  <path d="M 200 120 Q 210 100 230 110 Q 240 130 220 150" fill="none" stroke="#a8c8d8" stroke-width="2.5" opacity="0.4" stroke-linecap="round"/>
  <path d="M 280 85 Q 300 95 305 115" fill="none" stroke="#7eb3d4" stroke-width="2" opacity="0.35" stroke-linecap="round"/>
  
  <!-- Left ear/abstract animal element (redesigned) -->
  <path d="M 160 150 Q 130 120 135 90 Q 145 85 155 105 Q 160 125 165 145 Z" fill="#7eb3d4" opacity="0.7"/>
  <ellipse cx="150" cy="115" rx="8" ry="18" fill="#a8d4e8" opacity="0.5" transform="rotate(-25 150 115)"/>
  
  <!-- Right ear/abstract animal element (redesigned) -->
  <path d="M 352 150 Q 382 120 377 90 Q 367 85 357 105 Q 352 125 347 145 Z" fill="#7eb3d4" opacity="0.7"/>
  <ellipse cx="362" cy="115" rx="8" ry="18" fill="#a8d4e8" opacity="0.5" transform="rotate(25 362 115)"/>
  
  <!-- Headphone/tech accessory (original design) -->
  <!-- Left side -->
  <path d="M 180 160 Q 160 140 155 110 Q 158 95 170 100 Q 185 110 190 140 Q 188 155 185 165 Z" 
        fill="none" stroke="#6b8fb3" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
  <!-- Left ear cup (stylized) -->
  <circle cx="155" cy="105" r="15" fill="none" stroke="#6b8fb3" stroke-width="2.5" opacity="0.7"/>
  <circle cx="155" cy="105" r="9" fill="#8fa8c8" opacity="0.6"/>
  
  <!-- Right side -->
  <path d="M 332 160 Q 352 140 357 110 Q 354 95 342 100 Q 327 110 322 140 Q 324 155 327 165 Z" 
        fill="none" stroke="#6b8fb3" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
  <!-- Right ear cup (stylized) -->
  <circle cx="357" cy="105" r="15" fill="none" stroke="#6b8fb3" stroke-width="2.5" opacity="0.7"/>
  <circle cx="357" cy="105" r="9" fill="#8fa8c8" opacity="0.6"/>
  
  <!-- Tech glow accent on headphone (subtle) -->
  <circle cx="155" cy="105" r="20" fill="none" stroke="#5fa0d4" stroke-width="1" opacity="0.25"/>
  <circle cx="357" cy="105" r="20" fill="none" stroke="#5fa0d4" stroke-width="1" opacity="0.25"/>
  
  <!-- Face -->
  <!-- Left eye (half-lidded, calm) -->
  <g>
    <ellipse cx="210" cy="190" rx="18" ry="24" fill="#e8f0f8" stroke="#8ba8c8" stroke-width="1.5" opacity="0.9"/>
    <!-- Upper lid (half covering) -->
    <path d="M 195 185 Q 210 175 225 185 L 225 195 Q 210 185 195 195 Z" fill="#d4e8f5" opacity="0.7"/>
    <!-- Pupil -->
    <circle cx="210" cy="200" r="11" fill="#6b8fb3" opacity="0.8"/>
    <!-- Eye shine -->
    <circle cx="212" cy="198" r="4.5" fill="#a8d4e8" opacity="0.6"/>
  </g>
  
  <!-- Right eye (half-lidded, calm) -->
  <g>
    <ellipse cx="302" cy="190" rx="18" ry="24" fill="#e8f0f8" stroke="#8ba8c8" stroke-width="1.5" opacity="0.9"/>
    <!-- Upper lid (half covering) -->
    <path d="M 287 185 Q 302 175 317 185 L 317 195 Q 302 185 287 195 Z" fill="#d4e8f5" opacity="0.7"/>
    <!-- Pupil -->
    <circle cx="302" cy="200" r="11" fill="#6b8fb3" opacity="0.8"/>
    <!-- Eye shine -->
    <circle cx="304" cy="198" r="4.5" fill="#a8d4e8" opacity="0.6"/>
  </g>
  
  <!-- Subtle nose (minimal) -->
  <line x1="256" y1="220" x2="256" y2="235" stroke="#b3c8d8" stroke-width="1.5" opacity="0.4" stroke-linecap="round"/>
  
  <!-- Mouth (subtle, slightly mysterious) -->
  <path d="M 235 260 Q 256 275 277 260" fill="none" stroke="#8ba8c8" stroke-width="2" opacity="0.5" stroke-linecap="round"/>
  
  <!-- Soft blush on cheeks -->
  <ellipse cx="160" cy="225" rx="22" ry="15" fill="#d4a8b8" opacity="0.2"/>
  <ellipse cx="352" cy="225" rx="22" ry="15" fill="#d4a8b8" opacity="0.2"/>
  
  <!-- Soft highlight on head (diffused lighting) -->
  <ellipse cx="200" cy="130" rx="45" ry="35" fill="#e8f5ff" opacity="0.25" filter="blur(8px)"/>
</svg>
